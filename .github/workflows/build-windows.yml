name: Build Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag from app (for example v2.6.50)"
        required: true
jobs:
  windows:
    if: github.repository == 'GoodFight37/Unreleased'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_DL_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release identity and app ancestry
        shell: bash
        run: |
          node scripts/check-release.cjs "$RELEASE_TAG"
          git fetch origin app
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Install dependencies
        run: npm ci
      - name: Check main process and tests
        run: |
          npm run typecheck:electron
          npm run test:scripts
          npm run test:electron
      - name: Build renderer
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: npm run build
      - name: Package Windows x64 installer
        run: npx electron-builder --win --x64 --publish never
      - name: Upload installer, then update manifest
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          installer="release/Unreleased Glass-Setup-$version.exe"
          test -f "$installer"
          test -f "$installer.blockmap"
          test -f release/latest.yml
          # GitHub turns spaces in asset names into dots, but latest.yml names the file with hyphens: upload under that name or the updater gets a 404.
          cp "$installer" "release/Unreleased-Glass-Setup-$version.exe"
          cp "$installer.blockmap" "release/Unreleased-Glass-Setup-$version.exe.blockmap"
          installer="release/Unreleased-Glass-Setup-$version.exe"
          gh release upload "$RELEASE_TAG" "$installer" "$installer.blockmap" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" release/latest.yml --clobber --repo "$GITHUB_REPOSITORY"
