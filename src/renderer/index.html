<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="./" />
    <script>if(/^https?:/.test(location.protocol))document.querySelector('base').href='/'</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://juicewrldapi.com" crossorigin />
    <link rel="preconnect" href="https://juicewrldapi.com" />

    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval' 'sha256-xjpTVCo7o4K9QG8ZmAgfjVUbc2OdYbdKgT/ClSf5AWE=' 'sha256-DalSI+ICv7kcV+43N8QN6XuXql+ZJwy3Yj2YOF8AtBA=';
      style-src 'self';
      img-src 'self' data: blob: local-media: https:;
      media-src 'self' blob: local-media: https:;
      font-src 'self';
      connect-src 'self' data: blob: https://juicewrldapi.com https://*.juicewrldapi.com wss://juicewrldapi.com wss://*.juicewrldapi.com https://ws.audioscrobbler.com https://api.allorigins.win https://corsproxy.io https://images.weserv.nl https://api.github.com https://tenor.googleapis.com https://*.tenor.com https://api.giphy.com https://*.giphy.com https://*.thesongapi.net wss://*.thesongapi.net local-media:;
      worker-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <meta name="theme-color" content="#121212" />
    <title>Unreleased Glass</title>

    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('wavelength-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch(_) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script src="./startup-theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
